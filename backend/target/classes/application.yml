server:
  port: 8080

spring:
  application:
    name: costmatrix-backend

  datasource:
    url: jdbc:mysql://localhost:3306/cloud_optimizer_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 900000 # 15 minutes
    refresh-expiration-ms: 604800000 # 7 days
    pre-mfa-expiration-ms: 300000 # 5 minutes

  mfa:
    issuer: CostMatrix
